[project]
name = "baby-gift-registry"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "itsdangerous>=2.2",
    "starlette>=0.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
